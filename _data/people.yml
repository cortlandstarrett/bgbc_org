elders:
  - name: "Kenny Loehe"
    role: "Senior Pastor"
    image: /assets/images/staff/kenny-loehe.jpg
    bio: >
      Pastor Kenny Loehe has served as lead teaching pastor of Battle Ground Bible Church
      since 2002. He earned his B.A. at Southeastern Bible College (1997) and his M.Div. at
      The Master’s Seminary (2001). In addition to his Sunday morning pulpit ministry, Pastor
      Kenny also teaches the StartingPoint membership class and an occasional NT Greek class.
      He and Stephanie have been married since 1998 and have been blessed with four daughters;
      Clarissa, Adi, Annalise, and Maggie.
  - name: "Max Moore"
    role: "Associate Pastor, Next Generation Ministries"
    image: /assets/images/staff/max-moore.jpeg
    bio: >
      Pastor Max Moore has been serving as the Associate Pastor of Next Generation Ministries
      at Battle Ground Bible Church since July 2026. He is currently completing his Bachelor’s
      degree in Pastoral Ministries through Calvary University’s online program. Max primarily
      ministers to the Jr. High and High School students, teaching on Wednesday nights and
      during Sunday School. He has a passion for discipling the next generation and helping
      students grow in their knowledge and love of God’s Word. Max and his wife, Mary, were
      married on December 15, 2025. They are expecting their first child, a daughter named Ann
      Elizabeth, on their first wedding anniversary. Max’s ministry also includes his
      involvement with Abolish Abortion Indiana.
  - name: "Roger Criswell"
    role: "Elder"
    image: /assets/images/staff/roger-criswell.jpg
    bio: >
      Roger Criswell Roger has been attending Battle Ground Bible Church since 1990, along
      with Joyce, his wife, whom he married in 1961.  He loves spending time outside walking
      their dog.
  - name: "Jake Goodman"
    role: "Elder"
    image: /assets/images/staff/jake-goodman.jpeg
    bio: >
      Jake Goodman has been attending Battle Ground Bible Church since the fall of 2021, along
      with his wife Heather and three children. Jake was born and raised in Rensselaer,
      Indiana. He met his wife Heather while attending Grace College in Winona Lake and
      relocated to the Lafayette area after getting married. Jake works as a civil engineer
      for a consulting firm in Lafayette and enjoys working on vehicles at his dad’s shop as
      well as spending time with his family. Since becoming a member at BGBC in 2022, Jake has
      served as a trustee, is currently serving in youth ministries and looks forward to
      serving as an elder beginning in 2026.
  - name: "Steve Riedel"
    role: "Elder"
    image: /assets/images/staff/steve-riedel.jpg
    bio: >
      Steve Riedel has been a member of BGBC since 2006 and became an elder in 2023.  He works
      for Saab, Inc. and helps run the family farm with his wife, Lynn. They and their
      children enjoy 4-H, raising cattle, training and showing llamas, and various sports.
      You’ll also find him helping facilitate FUEL youth group and serving as church janitor.

deacons:
  - name: "Brant Hamby"
    role: "Deacon"
    image: /assets/images/staff/brant-hamby.jpeg
    bio: >
      Brant Hamby moved to Lafayette in 2009 and has been a member of BGBC for almost as long.
      He married Christine in 1997. They have raised four children and have added one son-in-
      law to the mix. Brant has been employed by Tate & Lyle for over 30 years. He spends his
      spare time trying out new recipes on his smoker and spending time with his family.
  - name: "Aaron Harkleroad"
    role: "Deacon"
    image: /assets/images/staff/aaron-harkleroad.jpg
    bio: >
      Aaron Harkleroad  married Naomi in 2003 they moved to Lafayette in 2011. They have five
      kids. They started attending Battleground Bible Church in 2022.  Aaron enjoys spending
      time as a family and collecting and playing board games.
  - name: "Greg Jones"
    role: "Deacon"
    image: /assets/images/staff/greg-jones.jpg
    bio: >
      Greg Jones was born and raised in Newark, NJ, served his country in the US Navy from
      1983 to 1987, and married his loving wife, Pamela, in 2012. Shortly after completing his
      military service he moved to Lafayette, IN, and eventually began a career as a
      Journeyman Wireman with IBEW local union 668 in 2007 where he also serves as an officer
      and committee member. Greg has been a member of BGBC since 2019, serves as a deacon and
      leads the audio/visual team. He has also been on staff at the local men’s Bible Study
      Fellowship since 2017 promoting strong commitment to Biblical instruction and spiritual
      development. His dedication to loving others with the love of Christ guides both his
      service and daily conduct.
  - name: "Isaac Rivera"
    role: "Deacon"
    image: /assets/images/staff/isaac-rivera.jpg
    bio: >
      Isaac Rivera married Alba in 1986.  They moved from Puerto Rico to Lafayette in 2003.
      They have two daughters (Abby & Nel) and four grandchildren (Athena, Penelope, Norr and
      Isaac Todd).  He is a chemist by education and retired from the Pharma Industry after 30
      years.  He spends his spare time trying out new recipes on his smoker, playing golf and
      doing yard work both at home and church.  He also loves playing pickleball, playing
      games and watching movies with Alba.

trustees:
  - name: "Steve Dunbar"
    role: "Trustee"
    image: /assets/images/staff/steve-dunbar.jpg
    bio: >
      Steve Dunbar has been attending BGBC since 2008, along with his wife, Judy, whom he
      married in 1970.  In his free time Steve enjoys hunting and fishing.  “I love this
      church.”
  - name: "Ike Hamby"
    role: "Trustee"
    image: /assets/images/staff/isaak-hamby.jpg
    bio: >
      Ike Hamby has been attending BGBC since 2010. He started attending BGBC with his
      parents, his twin sister and two older sisters. Ike loves to work on projects and
      research history. He also enjoys hunting and fishing. In his free time, Ike is a part-
      time coach for a middle school wrestling team. He is an apprentice for the IBEW.
  - name: "Ben Harkleroad"
    role: "Trustee"
    image: /assets/images/staff/ben-harkleroad.jpg
    bio: >
      Ben Harkleroad has been attending BGBC since 2022. He was born in Pennsylvania and moved
      to Indiana in 2011. He works as a shipper at Antique Candle Co. in Lafayette. He also
      serves in the sound booth at BGBC.
  - name: "Tyler Hewitt"
    role: "Trustee"
    image: /assets/images/staff/tyler-hewitt.jpg
    bio: >
      Tyler Hewitt has been attending BGBC since 2021 and became a member in 2022.  He was
      born and raised in Lafayette and works for the City of Lafayette.  Aside from his
      position as a Trustee, he also assists his wife, Clarissa, with Children’s Church and
      preparing morning coffee.
  - name: "Mark Jansma"
    role: "Trustee"
    image: /assets/images/staff/mark-jansma.jpg
    bio: >
      Mark Jansma and wife Betsy have been attending BGBC since 2015.  He was born and raised
      in central Indiana and works for the City of West Lafayette.  Aside from his position as
      a Trustee, he also assists his wife with Children’s Church.
  - name: "Jeff Mikels"
    role: "Trustee"
    image: /assets/images/staff/jeff-mikels.jpg
    bio: >
      Jeff Mikels and his wife Marie began attending BGBC in the spring of 2018. They were
      married in 2012 and the Lord has blessed them with three children. He is an Ivy Tech
      graduate with a diverse work background in general construction, automotive service &
      fabrication, business management and close to 20 years in DSD Route Sales. Jeff enjoys
      spending time in the gym lifting, cooking, mountain biking with his son, and gardening
      with Marie.

support_staff:
  - name: "Stephanie Loehe"
    role: "Support Staff"
    image: /assets/images/staff/stephanie-loehe.jpg
    bio: >
      Stephanie Loehe and her husband, Kenny, came from Southern California to BGBC in 2002.
      She serves as the church secretary, sings on the music team, teaches Kids’ Club on
      Wednesday nights, and participates in ladies’ Bible study.  She and Kenny have been
      married since 1998.  They have graduated 3 daughters with the last one set to graduate
      in 2029.
  - name: "Donna Peterson"
    role: "Support Staff"
    image: /assets/images/staff/donna-peterson.jpg
    bio: >
      Donna Peterson Lives in Battle Ground.  She has been a member since 2007.  She has one
      adult child and four grandchildren.  Donna is currently serving as the church treasurer.
