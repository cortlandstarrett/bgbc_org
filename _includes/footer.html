<footer class="site-footer">
  <div class="site-footer__inner">
    <ul class="site-footer__contact">
      <li><a href="{{ site.data.site.maps_url }}">{{ site.data.site.address }}, {{ site.data.site.city }}, {{ site.data.site.state }} {{ site.data.site.zip }}</a></li>
      <li><a href="tel:{{ site.data.site.phone_tel }}">{{ site.data.site.phone }}</a></li>
      <li><a href="mailto:{{ site.data.site.email }}">{{ site.data.site.email }}</a></li>
    </ul>
  </div>
</footer>
