<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__name">{{ site.data.site.name }}</p>
    <p>
      {{ site.data.site.address }}<br>
      {{ site.data.site.city }}, {{ site.data.site.state }} {{ site.data.site.zip }}
    </p>
    <p>
      <a href="tel:{{ site.data.site.phone | replace: '(', '' | replace: ')', '' | replace: ' ', '-' | replace: '.', '-' }}">{{ site.data.site.phone }}</a><br>
      <a href="mailto:{{ site.data.site.email }}">{{ site.data.site.email }}</a>
    </p>
  </div>
</footer>
