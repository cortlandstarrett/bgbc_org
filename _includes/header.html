<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img class="site-brand__logo" src="{{ '/assets/images/brand/logo-pillar.png' | relative_url }}" alt="" width="48" height="48">
      <span class="site-brand__text">
        <span class="site-brand__name"><strong>Battle Ground</strong> Bible Church</span>
        <span class="site-brand__tagline">{{ site.data.site.tagline }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
