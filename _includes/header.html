<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-brand__name">{{ site.data.site.name }}</span>
      <span class="site-brand__tagline">{{ site.data.site.tagline }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
